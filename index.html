<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mango DEX App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #05070a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
    }
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      background: transparent;
    }
    .picker-container {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    .picker-item {
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Component SmoothWheelPicker
    function SmoothWheelPicker({ options, value, onChange }) {
      const containerRef = useRef(null);
      const itemHeight = 44;

      useEffect(() => {
        if (containerRef.current) {
          const index = options.indexOf(value);
          if (index !== -1) {
            containerRef.current.scrollTop = index * itemHeight;
          }
        }
      }, []);

      const handleScroll = (e) => {
        const scrollTop = e.target.scrollTop;
        const index = Math.round(scrollTop / itemHeight);
        if (options[index] && options[index] !== value) {
          onChange(options[index]);
        }
      };

      return (
        <div className="relative w-full h-[220px] flex items-center justify-center overflow-hidden my-2 touch-pan-y">
          <div className="absolute w-full h-[44px] bg-[#18202c]/80 rounded-xl border border-gray-700/60 pointer-events-none z-0"></div>

          <div 
            ref={containerRef}
            onScroll={handleScroll}
            className="picker-container w-full h-full overflow-y-auto overflow-x-hidden z-10 py-[88px] no-scrollbar"
            style={{ scrollbarWidth: 'none', touchAction: 'pan-y' }}
          >
            {options.map((option) => {
              const isSelected = option === value;
              return (
                <div
                  key={option}
                  onClick={() => onChange(option)}
                  className={`picker-item h-[44px] flex items-center justify-center font-semibold text-base transition-all duration-150 cursor-pointer select-none ${
                    isSelected 
                      ? 'text-white text-lg font-bold scale-105 opacity-100' 
                      : 'text-gray-500 text-sm opacity-40 hover:opacity-70'
                  }`}
                >
                  {option}
                </div>
              );
            })}
          </div>

          <div className="absolute top-0 left-0 right-0 h-[88px] bg-gradient-to-b from-[#121620] via-[#121620]/80 to-transparent pointer-events-none z-20"></div>
          <div className="absolute bottom-0 left-0 right-0 h-[88px] bg-gradient-to-t from-[#121620] via-[#121620]/80 to-transparent pointer-events-none z-20"></div>
        </div>
      );
    }

    // Component Bảng Chữ Ký (Canvas)
    function SignatureModal({ onConfirm, onClose }) {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasSignature, setHasSignature] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (canvas) {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          const ctx = canvas.getContext('2d');
          ctx.strokeStyle = '#21d0ff';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }
      }, []);

      const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      };

      const startDrawing = (e) => {
        setIsDrawing(true);
        const { x, y } = getPos(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const { x, y } = getPos(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(x, y);
        ctx.stroke();
        setHasSignature(true);
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setHasSignature(false);
      };

      const handleConfirm = () => {
        if (!hasSignature) {
          alert('Vui lòng ký tên trước khi xác nhận!');
          return;
        }
        onConfirm();
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end justify-center max-w-md mx-auto">
          <div className="w-full bg-[#181a24] rounded-t-3xl border-t border-gray-800 p-5 space-y-4 shadow-2xl animate-slide-up">
            <div className="flex justify-between items-center">
              <span className="text-base font-bold text-white">Chữ ký</span>
              <button onClick={clearCanvas} className="text-xs text-[#21d0ff] font-semibold hover:underline">
                Xóa
              </button>
            </div>

            <div className="relative bg-[#222534] border border-gray-700/60 rounded-2xl h-44 overflow-hidden touch-none">
              <canvas
                ref={canvasRef}
                onMouseDown={startDrawing}
                onMouseMove={draw}
                onMouseUp={stopDrawing}
                onMouseLeave={stopDrawing}
                onTouchStart={startDrawing}
                onTouchMove={draw}
                onTouchEnd={stopDrawing}
                className="w-full h-full cursor-crosshair"
              />
            </div>

            <button
              onClick={handleConfirm}
              className="w-full bg-[#21d0ff] hover:bg-cyan-300 text-black font-extrabold py-3.5 rounded-full text-sm transition shadow-lg shadow-cyan-500/20 active:scale-98"
            >
              Xác nhận chữ ký
            </button>
          </div>
        </div>
      );
    }

    // Component Modal Gợi Ý (Xác Nhận Đơn Hàng)
    function OrderConfirmModal({ orderData, onConfirm, onCancel }) {
      if (!orderData) return null;

      return (
        <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 max-w-md mx-auto">
          <div className="w-full bg-[#1e2230] rounded-2xl border border-gray-800 p-6 space-y-5 shadow-2xl animate-fade-in">
            <h3 className="text-center font-bold text-lg text-white">Gợi ý</h3>

            <div className="space-y-3.5 text-xs">
              <div className="flex justify-between items-center">
                <span className="text-gray-400">Sản phẩm:</span>
                <span className="text-white font-bold text-sm">{orderData.pkgName}</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-gray-400">Kỳ hạn:</span>
                <span className="text-white font-medium">{orderData.days} Ngày</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-gray-400">Số tiền:</span>
                <span className="text-white font-bold text-sm">{orderData.amount.toFixed(4)} USDT</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-gray-400">Gốc + lợi nhuận ước tính:</span>
                <span className="text-[#21d0ff] font-bold text-sm">{orderData.estimatedTotal} USDT</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-gray-400">Lợi nhuận hằng ngày:</span>
                <span className="text-white font-medium">{orderData.dailyRoi}</span>
              </div>

              <div className="pt-2 text-[#21d0ff] font-medium text-xs leading-relaxed">
                {orderData.pkgName === 'Mango-0' 
                  ? 'Sản phẩm này thanh toán bằng tiền trải nghiệm' 
                  : 'Sản phẩm này thanh toán bằng số dư nạp'}
              </div>
            </div>

            <div className="flex gap-3 pt-2">
              <button
                onClick={onCancel}
                className="flex-1 bg-[#21d0ff] hover:bg-cyan-300 text-black font-bold py-3 rounded-full text-sm transition text-center"
              >
                Hủy
              </button>
              <button
                onClick={onConfirm}
                className="flex-1 bg-[#2b3144] hover:bg-[#353c54] text-white font-bold py-3 rounded-full text-sm transition text-center border border-gray-700"
              >
                Xác nhận
              </button>
            </div>
          </div>
        </div>
      );
    }

    function MangoApp() {
      // Auth States (Mặc định ở màn hình login)
      const [authMode, setAuthMode] = useState('login');
      const [loginInput, setLoginInput] = useState({ account: '', password: '' });
      const [regInput, setRegInput] = useState({ account: '', password: '', inviteCode: '' });
      
      // User & App States
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [usersDatabase, setUsersDatabase] = useState([
        {
          uid: '2420793',
          account: 'admin@gmail.com',
          password: 'admin123',
          role: 'admin',
          balanceWithdrawable: 0.0000,
          balanceDeposit: 1000.0000,
          balanceTrial: 500.0000,
          isKycVerified: false,
          bankName: 'MBBank',
          accountNumber: '123456789',
          accountHolder: 'MANGO ADMIN'
        }
      ]);

      const [kycSubmissions, setKycSubmissions] = useState([]);
      const [depositSubmissions, setDepositSubmissions] = useState([]);
      const [withdrawSubmissions, setWithdrawSubmissions] = useState([]);

      const [purchaseHistory, setPurchaseHistory] = useState([]);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [historyTab, setHistoryTab] = useState('ongoing');

      const [pendingOrder, setPendingOrder] = useState(null);
      const [showSignatureModal, setShowSignatureModal] = useState(false);
      const [showConfirmModal, setShowConfirmModal] = useState(false);

      const [kycModal, setKycModal] = useState(false);
      const [kycInput, setKycInput] = useState({
        fullName: '',
        phone: '',
        docType: 'CMND/CCCD',
        docNumber: '',
        imageUrl: ''
      });

      const [mgoInputs, setMgoInputs] = useState({
        'Mango-A': { amount: '50.0000', voucher: '' },
        'Mango-B': { amount: '1000.0000', voucher: '' },
        'Mango-0': { amount: '500.0000', voucher: '' }
      });

      const [depositModal, setDepositModal] = useState(false);
      const [checkoutModal, setCheckoutModal] = useState(false);
      const [withdrawModal, setWithdrawModal] = useState(false);
      
      const [fundDetailModal, setFundDetailModal] = useState(false);
      const [fundCategory, setFundCategory] = useState('Tất cả');

      const [depositCurrency, setDepositCurrency] = useState('USDT');
      const [depositChain, setDepositChain] = useState('tron');
      const [depositAmount, setDepositAmount] = useState('');
      
      const [adminWallets, setAdminWallets] = useState([
        { id: 1, name: 'tron', address: 'TSmBRarJHw3cQEGxbVwjJM8LHmzq8ocTnS' },
        { id: 2, name: 'bsc', address: '0x71C32A9C021E23456789abcdefABCDEF12345678' }
      ]);
      const [newWalletName, setNewWalletName] = useState('tron');
      const [newWalletAddress, setNewWalletAddress] = useState('');

      const [checkoutData, setCheckoutData] = useState(null);
      const [timeLeft, setTimeLeft] = useState(1800);

      const [withdrawChain, setWithdrawChain] = useState('tron');
      const [withdrawAddress, setWithdrawAddress] = useState('');
      const [withdrawAmount, setWithdrawAmount] = useState('');
      const [withdrawPassword, setWithdrawPassword] = useState('');

      const [tempPickerValue, setTempPickerValue] = useState('');
      const [pickerType, setPickerType] = useState(null);

      const [fundLogs, setFundLogs] = useState([
        { type: 'Tất cả', title: 'Tặng tiền trải nghiệm', amount: '+500.0000', time: '2026.09.13 13:22:12', withdrawable: '-0.0000' }
      ]);

      const fundCategories = [
        'Tất cả',
        'Quản lý tài sản',
        'Nạp tiền',
        'Rút tiền',
        'Thưởng mời trực tiếp',
        'Thưởng mời gián tiếp'
      ];

      // Đã loại bỏ đoạn code tự động đăng nhập mặc định để hiển thị màn hình Đăng nhập / Đăng ký khi mới truy cập.
      useEffect(() => {}, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [authMode, activeTab, showHistoryModal, depositModal, withdrawModal, checkoutModal, pickerType, fundDetailModal, fundCategory, showSignatureModal, showConfirmModal, kycModal]);

      useEffect(() => {
        let timer = null;
        if (checkoutModal && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => prev - 1);
          }, 1000);
        }
        return () => {
          if (timer) clearInterval(timer);
        };
      }, [checkoutModal, timeLeft]);

      const formatTimeLeft = (seconds) => {
        if (seconds <= 0) return '00:00';
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const openPicker = (type) => {
        setPickerType(type);
        if (type === 'currency_dep') setTempPickerValue(depositCurrency);
        if (type === 'chain_dep') setTempPickerValue(depositChain);
        if (type === 'chain_with') setTempPickerValue(withdrawChain);
        if (type === 'doc_type') setTempPickerValue(kycInput.docType);
        if (type === 'admin_chain') setTempPickerValue(newWalletName);
      };

      const handleConfirmPicker = () => {
        if (pickerType === 'currency_dep') setDepositCurrency(tempPickerValue);
        if (pickerType === 'chain_dep') setDepositChain(tempPickerValue);
        if (pickerType === 'chain_with') setWithdrawChain(tempPickerValue);
        if (pickerType === 'doc_type') setKycInput(prev => ({ ...prev, docType: tempPickerValue }));
        if (pickerType === 'admin_chain') setNewWalletName(tempPickerValue);
        setPickerType(null);
      };

      const handleInputChange = (pkgName, field, value) => {
        setMgoInputs(prev => ({
          ...prev,
          [pkgName]: { ...prev[pkgName], [field]: value }
        }));
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!regInput.account || !regInput.password) {
          alert('Vui lòng nhập đầy đủ tài khoản và mật khẩu!');
          return;
        }

        const exists = usersDatabase.some(u => u.account === regInput.account);
        if (exists) {
          alert('Tài khoản đã tồn tại!');
          return;
        }

        const newUid = Math.floor(1000000 + Math.random() * 9000000).toString();
        const newUser = {
          uid: newUid,
          account: regInput.account,
          password: regInput.password,
          role: 'user',
          balanceWithdrawable: 0.0000,
          balanceDeposit: 0.0000,
          balanceTrial: 500.0000,
          isKycVerified: false,
          bankName: '', accountNumber: '', accountHolder: ''
        };

        setUsersDatabase([...usersDatabase, newUser]);
        setCurrentUser(newUser);
        setAuthMode('authenticated');
        alert('Đăng ký tài khoản thành công! Tặng bạn 500 USDT tiền trải nghiệm.');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const user = usersDatabase.find(u => u.account === loginInput.account && u.password === loginInput.password);
        if (user) {
          setCurrentUser(user);
          setAuthMode('authenticated');
        } else {
          alert('Tài khoản hoặc mật khẩu không chính xác!');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setAuthMode('login');
        setActiveTab('home');
      };

      const formatDateTime = (date) => {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const seconds = String(d.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setKycInput(prev => ({ ...prev, imageUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleKycSubmit = () => {
        if (!kycInput.fullName || !kycInput.phone || !kycInput.docNumber) {
          alert('Vui lòng nhập đầy đủ thông tin KYC!');
          return;
        }
        if (!kycInput.imageUrl) {
          alert('Vui lòng tải lên hình ảnh giấy tờ xác minh!');
          return;
        }

        const newSubmission = {
          id: Date.now(),
          uid: currentUser.uid,
          account: currentUser.account,
          fullName: kycInput.fullName,
          phone: kycInput.phone,
          docType: kycInput.docType,
          docNumber: kycInput.docNumber,
          imageUrl: kycInput.imageUrl,
          status: 'pending'
        };

        setKycSubmissions([newSubmission, ...kycSubmissions]);
        setKycModal(false);
        alert('Gửi thông tin xác minh KYC thành công! Vui lòng đợi quản trị viên phê duyệt.');
      };

      const handleApproveKyc = (subId, uid) => {
        setKycSubmissions(kycSubmissions.map(s => s.id === subId ? { ...s, status: 'approved' } : s));
        setUsersDatabase(usersDatabase.map(u => u.uid === uid ? { ...u, isKycVerified: true } : u));
        if (currentUser && currentUser.uid === uid) {
          setCurrentUser({ ...currentUser, isKycVerified: true });
        }
        alert('Đã duyệt hồ sơ KYC thành công!');
      };

      const handleRejectKyc = (subId) => {
        setKycSubmissions(kycSubmissions.map(s => s.id === subId ? { ...s, status: 'rejected' } : s));
        alert('Đã từ chối hồ sơ KYC!');
      };

      const handleAddAdminWallet = () => {
        if (!newWalletName || !newWalletAddress) {
          alert('Vui lòng chọn mạng lưới và nhập địa chỉ ví!');
          return;
        }
        
        const existingIndex = adminWallets.findIndex(w => w.name.toLowerCase() === newWalletName.toLowerCase());
        let updated = [...adminWallets];
        if (existingIndex !== -1) {
          updated[existingIndex].address = newWalletAddress;
        } else {
          updated.push({
            id: Date.now(),
            name: newWalletName,
            address: newWalletAddress
          });
        }
        
        setAdminWallets(updated);
        setNewWalletAddress('');
        alert('Cập nhật địa chỉ ví thành công!');
      };

      const handleDeleteAdminWallet = (id) => {
        const updated = adminWallets.filter(w => w.id !== id);
        setAdminWallets(updated);
      };

      const handleApproveDeposit = (subId, uid, amount) => {
        setDepositSubmissions(depositSubmissions.map(s => s.id === subId ? { ...s, status: 'approved' } : s));
        setUsersDatabase(usersDatabase.map(u => {
          if (u.uid === uid) {
            return { ...u, balanceDeposit: u.balanceDeposit + amount };
          }
          return u;
        }));
        if (currentUser && currentUser.uid === uid) {
          setCurrentUser(prev => ({ ...prev, balanceDeposit: prev.balanceDeposit + amount }));
        }
        alert(`Đã duyệt nạp ${amount} USDT cho tài khoản UID: ${uid}!`);
      };

      const handleRejectDeposit = (subId) => {
        setDepositSubmissions(depositSubmissions.map(s => s.id === subId ? { ...s, status: 'rejected' } : s));
        alert('Đã từ chối đơn nạp tiền!');
      };

      const handleApproveWithdraw = (subId, uid, amount) => {
        setWithdrawSubmissions(withdrawSubmissions.map(s => s.id === subId ? { ...s, status: 'approved' } : s));
        alert(`Đã duyệt lệnh rút ${amount} USDT cho UID: ${uid}!`);
      };

      const handleRejectWithdraw = (subId, uid, amount) => {
        setWithdrawSubmissions(withdrawSubmissions.map(s => s.id === subId ? { ...s, status: 'rejected' } : s));
        setUsersDatabase(usersDatabase.map(u => {
          if (u.uid === uid) {
            return { ...u, balanceWithdrawable: u.balanceWithdrawable + amount };
          }
          return u;
        }));
        if (currentUser && currentUser.uid === uid) {
          setCurrentUser(prev => ({ ...prev, balanceWithdrawable: prev.balanceWithdrawable + amount }));
        }
        alert(`Đã từ chối lệnh rút và hoàn lại ${amount} USDT cho UID: ${uid}!`);
      };

      const handleInitiateBuy = (pkgName, minPrice, days, dailyRoi) => {
        if (!currentUser) return;
        const inputAmount = parseFloat(mgoInputs[pkgName]?.amount || 0);

        if (isNaN(inputAmount) || inputAmount < minPrice) {
          alert(`Số tiền mua tối thiểu cho gói ${pkgName} là ${minPrice} USDT!`);
          return;
        }

        if (pkgName === 'Mango-0') {
          if (currentUser.balanceTrial < inputAmount) {
            alert(`Số dư tiền trải nghiệm không đủ!`);
            return;
          }
        } else {
          if (currentUser.balanceDeposit < inputAmount) {
            alert(`Số dư nạp không đủ! Vui lòng nạp thêm USDT.`);
            return;
          }
        }

        const estimatedTotal = (inputAmount + (inputAmount * (parseFloat(dailyRoi) / 100) * days)).toFixed(4);

        setPendingOrder({
          pkgName,
          minPrice,
          days,
          dailyRoi,
          amount: inputAmount,
          estimatedTotal
        });

        setShowSignatureModal(true);
      };

      const handleSignatureConfirmed = () => {
        setShowSignatureModal(false);
        setShowConfirmModal(true);
      };

      const handleFinalConfirmBuy = () => {
        if (!pendingOrder) return;
        const { pkgName, amount, days, dailyRoi } = pendingOrder;

        let updatedUser = { ...currentUser };

        if (pkgName === 'Mango-0') {
          updatedUser.balanceTrial -= amount;
        } else {
          updatedUser.balanceDeposit -= amount;
        }

        setCurrentUser(updatedUser);

                    <span className="text-gray-400 text-xs">▼</span>
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="text-xs text-gray-300 block font-medium">Tên chuỗi</label>
                  <div 
                    onClick={() => openPicker('chain_dep')}
                    className="bg-[#121620] border border-gray-800 rounded-xl p-4 flex justify-between items-center cursor-pointer hover:border-gray-700 transition"
                  >
                    <span className="text-sm font-semibold text-[#21d0ff] font-bold">{depositChain}</span>
                    <span className="text-gray-400 text-xs">▼</span>
                  </div>
                </div>

                <div className="space-y-2 pt-1">
                  <label className="text-xs text-gray-300 block font-medium">Số tiền nạp</label>
                  <div className="bg-[#121620] border border-gray-800 rounded-xl p-4 flex items-center justify-center">
                    <input 
                      type="number" 
                      placeholder="Vui lòng nhập số tiền nạp"
                      value={depositAmount}
                      onChange={e => setDepositAmount(e.target.value)}
                      className="w-full bg-transparent text-sm text-white text-center focus:outline-none placeholder-gray-600 block"
                    />
                  </div>
                </div>

                <div className="pt-4">
                  <button 
                    onClick={handleConfirmDeposit}
                    className="w-full bg-[#21d0ff] hover:bg-cyan-300 text-black font-extrabold py-3.5 rounded-full text-sm transition shadow-lg shadow-cyan-500/10 active:scale-98"
                  >
                    Xác nhận nạp tiền & Gửi duyệt
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MÀN HÌNH THANH TOÁN */}
          {checkoutModal && checkoutData && (
            <div className="fixed inset-0 bg-[#05070a] z-50 flex flex-col max-w-md mx-auto animate-slide-up">
              <div className="flex items-center justify-between p-4 border-b border-gray-900">
                <button onClick={() => setCheckoutModal(false)} className="text-white text-xl font-bold w-8 h-8 flex items-center justify-center">
                  ←
                </button>
                <h2 className="text-base font-bold text-white text-center flex-1 pr-8">Thanh toán</h2>
              </div>

              <div className="p-4 space-y-4 flex-1 overflow-y-auto overflow-x-hidden">
                <div className="flex justify-center">
                  {timeLeft > 0 ? (
                    <div className="bg-[#3b2308] text-[#f59e0b] border border-[#78350f] text-xs px-4 py-1.5 rounded-full font-medium flex items-center gap-1.5 shadow-md">
                      <span>🕒</span>
                      <span>Đếm ngược {formatTimeLeft(timeLeft)}</span>
                    </div>
                  ) : (
                    <div className="bg-red-950/80 text-red-400 border border-red-800 text-xs px-4 py-1.5 rounded-full font-medium flex items-center gap-1.5 shadow-md">
                      <span>❌</span>
                      <span>Đã hết hạn thanh toán</span>
                    </div>
                  )}
                </div>

                <div className="bg-[#10141d] rounded-2xl p-5 border border-gray-800/80 text-center space-y-1 shadow-md">
                  <div className="text-xs text-gray-400">Số tiền thanh toán</div>
                  <div className="text-3xl font-black text-white tracking-tight">
                    {checkoutData.amount} {checkoutData.currency}
                  </div>
                  <div className="text-xs text-amber-500 font-medium pt-1">
                    Vui lòng thanh toán đúng số tiền
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl w-48 h-48 mx-auto flex items-center justify-center shadow-xl my-2 relative overflow-hidden">
                  <img 
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${checkoutData.address}`} 
                    alt="Payment QR" 
                    className="w-full h-full object-contain"
                  />
                </div>

                <div className="bg-[#10141d] rounded-2xl p-4 border border-gray-800/80 space-y-1">
                  <div className="text-[11px] text-gray-400">Địa chỉ / Số tài khoản thanh toán</div>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-xs font-bold text-white truncate font-mono">{checkoutData.address}</span>
                    <button onClick={() => copyToClipboard(checkoutData.address)} className="text-gray-400 hover:text-white p-1">
                      📋
                    </button>
                  </div>
                </div>

                <div className="bg-[#10141d] rounded-2xl p-4 border border-gray-800/80 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-gray-400">Mã đơn hàng</span>
                    <span className="text-white font-mono text-[11px]">{checkoutData.orderId}</span>
                  </div>
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-gray-400">Trạng thái</span>
                    <span className="bg-amber-950 text-amber-400 border border-amber-800 text-[10px] px-2.5 py-0.5 rounded font-semibold">
                      Chờ duyệt từ Admin
                    </span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MÀN HÌNH RÚT TIỀN */}
          {withdrawModal && currentUser && (
            <div className="fixed inset-0 bg-[#05070a] z-50 flex flex-col max-w-md mx-auto animate-slide-up">
              <div className="flex items-center justify-between p-4 border-b border-gray-900">
                <button onClick={() => setWithdrawModal(false)} className="text-white text-xl font-bold w-8 h-8 flex items-center justify-center">
                  ←
                </button>
                <h2 className="text-base font-bold text-white text-center flex-1 pr-8">Rút tiền</h2>
              </div>

              <div className="p-4 space-y-4 flex-1 overflow-y-auto overflow-x-hidden">
                <div className="space-y-1.5">
                  <label className="text-xs text-gray-300 block font-medium">Tên chuỗi</label>
                  <div 
                    onClick={() => openPicker('chain_with')}
                    className="bg-[#121620] border border-gray-800 rounded-xl p-4 flex justify-between items-center cursor-pointer hover:border-gray-700 transition"
                  >
                    <span className="text-sm font-semibold text-white">{withdrawChain}</span>
                    <span className="text-gray-400 text-xs">▼</span>
                  </div>
                </div>

                <div className="space-y-1.5">
                  <label className="text-xs text-gray-300 block font-medium">Địa chỉ rút tiền</label>
                  <div className="bg-[#121620] border border-gray-800 rounded-xl p-4 flex items-center justify-center overflow-hidden w-full">
                    <input 
                      type="text" 
                      placeholder="Vui lòng nhập địa chỉ rút tiền của bạn"
                      value={withdrawAddress}
                      onChange={e => setWithdrawAddress(e.target.value)}
                      className="w-full bg-transparent text-sm text-white text-center focus:outline-none placeholder-gray-600 block truncate"
                    />
                  </div>
                </div>

                <div className="space-y-1.5">
                  <div className="flex justify-between items-center text-xs">
                    <label className="text-gray-300 font-medium">Số tiền</label>
                    <span className="text-gray-400">Số dư khả dụng: {currentUser.balanceWithdrawable.toFixed(4)} USDT</span>
                  </div>
                  <div className="bg-[#121620] border border-gray-800 rounded-xl p-4 flex items-center justify-center">
                    <input 
                      type="number" 
                      placeholder="Vui lòng nhập số tiền"
                      value={withdrawAmount}
                      onChange={e => setWithdrawAmount(e.target.value)}
                      className="w-full bg-transparent text-sm text-white text-center focus:outline-none placeholder-gray-600 block"
                    />
                  </div>
                </div>

                <div className="space-y-1.5">
                  <label className="text-xs text-gray-300 block font-medium">Mật khẩu giao dịch</label>
                  <div className="bg-[#121620] border border-gray-800 rounded-xl p-4 flex items-center justify-center">
                    <input 
                      type="password" 
                      placeholder="Vui lòng nhập mật khẩu giao dịch"
                      value={withdrawPassword}
                      onChange={e => setWithdrawPassword(e.target.value)}
                      className="w-full bg-transparent text-sm text-white text-center focus:outline-none placeholder-gray-600 block"
                    />
                  </div>
                </div>

                <div className="pt-4">
                  <button 
                    onClick={handleConfirmWithdraw}
                    className="w-full bg-[#21d0ff] hover:bg-cyan-300 text-black font-extrabold py-3.5 rounded-full text-sm transition shadow-lg shadow-cyan-500/10 active:scale-98"
                  >
                    Gửi yêu cầu rút tiền
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM SHEET WHEEL PICKER MODAL */}
          {pickerType && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-end justify-center max-w-md mx-auto transition-opacity duration-200">
              <div className="w-full bg-[#121620] rounded-t-3xl border-t border-gray-800 p-4 space-y-2 shadow-2xl animate-slide-up">
                <div className="flex justify-between items-center pb-3 border-b border-gray-800/80">
                  <button onClick={() => setPickerType(null)} className="text-gray-400 text-sm font-medium px-2 py-1">Hủy</button>
                  <button onClick={handleConfirmPicker} className="text-[#21d0ff] text-sm font-bold px-2 py-1">Xác nhận</button>
                </div>

                <div>
                  {pickerType === 'currency_dep' && <SmoothWheelPicker options={['USDT', 'USDC']} value={tempPickerValue} onChange={setTempPickerValue} />}
                  {(pickerType === 'chain_dep' || pickerType === 'chain_with' || pickerType === 'admin_chain') && <SmoothWheelPicker options={['tron', 'bsc', 'polygon', 'ethereum']} value={tempPickerValue} onChange={setTempPickerValue} />}
                  {pickerType === 'doc_type' && <SmoothWheelPicker options={['CMND/CCCD', 'Hộ chiếu', 'Giấy phép lái xe']} value={tempPickerValue} onChange={setTempPickerValue} />}
                </div>
              </div>
            </div>
          )}

          {/* LỊCH SỬ ĐƠN HÀNG MODAL */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-[#05070a] z-50 flex flex-col max-w-md mx-auto animate-slide-up">
              <div className="flex items-center justify-between p-4 border-b border-gray-900/60 relative">
                <button onClick={() => setShowHistoryModal(false)} className="text-white text-lg font-bold w-8 h-8 flex items-center justify-center z-10">←</button>
                <h2 className="text-base font-bold text-white text-center absolute inset-0 flex items-center justify-center pointer-events-none">Lịch sử đơn hàng</h2>
              </div>

              <div className="p-4 pb-2">
                <div className="bg-[#10141d] p-1 rounded-full flex items-center justify-between border border-gray-800/60">
                  <button onClick={() => setHistoryTab('ongoing')} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all text-center ${historyTab === 'ongoing' ? 'bg-[#21d0ff] text-black shadow-md' : 'text-gray-400'}`}>Đang diễn ra</button>
                  <button onClick={() => setHistoryTab('completed')} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all text-center ${historyTab === 'completed' ? 'bg-[#21d0ff] text-black shadow-md' : 'text-gray-400'}`}>Đã hoàn thành</button>
                </div>
              </div>

              <div className="flex-1 flex flex-col p-4 overflow-y-auto overflow-x-hidden">
                {((historyTab === 'ongoing' && ongoingList.length === 0) || (historyTab === 'completed' && completedList.length === 0)) ? (
                  <div className="flex flex-col items-center justify-center space-y-4 my-auto">
                    <div className="text-gray-400 text-xs font-medium tracking-wide">Không có bản ghi</div>
                  </div>
                ) : (
                  <div className="w-full space-y-3">
                    {(historyTab === 'ongoing' ? ongoingList : completedList).map((item) => (
                      <div key={item.id} className="bg-[#121620] border border-gray-800/80 rounded-2xl p-4 space-y-2 text-xs shadow-md">
                        <div className="flex justify-between items-center pb-2 border-b border-gray-800/60">
                          <span className="font-bold text-sm text-white">{item.packageName}</span>
                          <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-semibold ${historyTab === 'ongoing' ? 'bg-cyan-950 text-[#21d0ff]' : 'bg-gray-800 text-gray-400'}`}>
                            {historyTab === 'ongoing' ? 'Đang hoạt động' : 'Đã kết thúc'}
                          </span>
                        </div>
                        <div className="text-gray-300 space-y-1.5 pt-1">
                          <div className="flex justify-between">
                            <span className="text-gray-400">Số tiền mua:</span>
                            <span className="text-[#21d0ff] font-bold">{item.amount.toFixed(4)} USDT</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-gray-400">Kỳ hạn / Lợi nhuận:</span>
                            <span className="text-white font-medium">{item.days} Ngày ({item.dailyRoi}/ngày)</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR */}
          {currentUser && (
            <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#0c0f17]/95 backdrop-blur-md border-t border-gray-800/80 flex justify-around py-2.5 text-[11px] z-40">
              <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'home' ? 'text-[#21d0ff] font-bold' : 'text-gray-400'}`}>
                <i data-lucide="home" className="w-5 h-5"></i> Trang chủ
              </button>
              <button onClick={() => setActiveTab('mgo')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'mgo' ? 'text-[#21d0ff] font-bold' : 'text-gray-400'}`}>
                <i data-lucide="box" className="w-5 h-5"></i> MGO
              </button>
              <button onClick={() => setActiveTab('community')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'community' ? 'text-[#21d0ff] font-bold' : 'text-gray-400'}`}>
                <i data-lucide="users" className="w-5 h-5"></i> Cộng đồng
              </button>
              <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center gap-1 transition ${activeTab === 'profile' ? 'text-[#21d0ff] font-bold' : 'text-gray-400'}`}>
                <i data-lucide="user-check" className="w-5 h-5"></i> Hồ sơ
              </button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MangoApp />);
  </script>
</body>
</html>
